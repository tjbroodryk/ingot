# Publish the landing page to GitHub Pages.
#
# What goes up is `@ingot/app` built in landing mode: the page in front of the
# project and the API reference, and no console. That is not a setting the
# deploy hides — `NEXT_PUBLIC_INGOT_MODE` decides which routes `next build`
# writes at all, so `out/dashboard` does not exist in the artefact this job
# uploads. See `apps/ingot-app/src/site/mode.ts`.
#
# The image built by `images.yml` is the other build of the same app, in
# dashboard mode, for somebody running the service. The two are different
# artefacts on purpose and neither is derived from the other.
name: pages

on:
  push:
    branches: [main]
    # The site is the only thing this publishes, so a change to the server has
    # no version of the page to put up. `packages/shared` is in the list
    # because the app typechecks against its `dist` during the build.
    paths:
      - 'apps/ingot-app/**'
      - 'packages/shared/**'
      - '.github/workflows/pages.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # OIDC, which is how `deploy-pages` proves to Pages that it is this workflow.
  # There is no token to mint or store.
  id-token: write

# One deploy at a time, and a queued one is not cancelled: unlike a container
# image, the site has exactly one live version, and cancelling the newer of two
# would leave the older one serving with nothing to say so.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Deliberately without `static_site_generator: next`. That option exists
      # to write a `basePath` into the Next config for you, and this repo's
      # config already reads one from the environment — two answers to the same
      # question, of which the injected one wins and is not in the tree.
      - uses: actions/configure-pages@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - run: bun install --frozen-lockfile

      # `turbo run build --filter` pulls in `packages/shared` through `^build`,
      # so the contract package is built first without being named here.
      #
      # Every variable here is inlined by `next build` — a static export has no
      # server to read them later — and every one is declared in
      # `apps/ingot-app/turbo.json` so the cache cannot hand back a build made
      # with different ones.
      #
      # ── moving to a custom domain ────────────────────────────────────────
      # Two steps, and only one of them is in this file:
      #
      #   1. Settings → Pages → Custom domain, and the DNS record it asks for.
      #      An Actions deploy takes the domain from that setting; the `CNAME`
      #      file is the branch-based mechanism and is not needed here.
      #   2. Settings → Variables → Actions → `SITE_URL`, set to the origin
      #      with its scheme and no trailing slash — `https://ingot.dev`.
      #
      # The second is what the two expressions below read, and between them
      # they are the whole difference between the two addresses: a project site
      # is served from `/<repo>` and has no origin worth writing down, and a
      # custom domain is served from the root and has one. Setting the variable
      # moves the site from the first to the second, and nothing in the tree
      # names either address.
      - name: Build the landing site
        env:
          NEXT_PUBLIC_INGOT_MODE: landing
          # The origin, once there is one. Empty until then, which is what
          # leaves `sitemap.xml` unwritten and `robots.txt` without a
          # `Sitemap:` line rather than pointing both at a guess. See
          # `apps/ingot-app/src/site/mode.ts`.
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          # A GitHub Pages project site is served from `/<repo>/`, and a page
          # built for `/` would ask for its stylesheets at the wrong path. Read
          # off the repository rather than written down, so a fork or a rename
          # does not silently publish a site with no CSS.
          #
          # A custom domain serves from the root instead, so the prefix goes
          # away the moment `SITE_URL` is set — one variable rather than two
          # that have to be kept agreeing, because two would eventually be set
          # to a domain and a subdirectory that is not on it.
          #
          # Written as "empty ⇒ the prefix" rather than the other way round,
          # and that is not a style choice. `a && '' || b` is the shape this
          # wants to be written in and it is broken for exactly this case: an
          # empty string is falsy, so the `&&` yields one, the `||` takes it as
          # a miss, and the prefix comes back on the branch that exists to drop
          # it. Testing the empty case first keeps both results truthy.
          NEXT_PUBLIC_BASE_PATH: "${{ vars.SITE_URL == '' && format('/{0}', github.event.repository.name) || '' }}"
        run: bunx turbo run build --filter=@ingot/app

      # No `.nojekyll` in the upload, and that is not an oversight: Jekyll runs
      # on the branch-based deploy, not on this one. An artefact goes up as the
      # files it contains, `_next/` included.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/ingot-app/out

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
