# Serving a Next.js static export.
#
# The two things this file exists for are `trailingSlash` and the hashed asset
# names; everything else here is the stock config with the port changed.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # `next.config.ts` sets `trailingSlash: true`, so every route is a directory
  # holding an `index.html`. Without this, `/dashboard/` resolves and
  # `/dashboard` 404s — a difference that does not exist under `next dev` and
  # appears the moment the site is behind a real server.
  # The last parameter is `=404` and not `/404.html`, which is the difference
  # between answering 404 and answering 200 with a page that says 404. A URI as
  # the fallback is served by internal redirect, so every unknown path came
  # back successful — indexable, uncacheable by any rule that keys on status,
  # and wrong about the one thing the page was there to report.
  #
  # It matters most for what this site leaves out on purpose: a landing build
  # has no `/dashboard`, and "no such route" has to be an answer rather than a
  # body. `error_page` below is what turns the 404 back into the page.
  # `scripts/emit-text.ts` writes the documentation pages a second time as
  # markdown, for a reader that would rather not parse the page. Stock
  # `mime.types` has no entry for `.md`, and the default —
  # `application/octet-stream` — is what turns a URL somebody pasted into a
  # download rather than a document.
  types {
    text/markdown md;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Everything under `_next/static` is content-addressed: the filename changes
  # when the bytes do, so it can never be stale and never needs revalidating.
  #
  # `^~` rather than a plain prefix, so this wins outright over the regex
  # below instead of being reached only when that one does not match.
  location ^~ /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The documents are not. A deploy that leaves a cached `index.html` in front
  # of new assets is a page referencing bundles that no longer exist, and a
  # cached `llms.txt` is an index of a build that is gone.
  location ~* \.(html|md|txt)$ {
    add_header Cache-Control "no-cache";
  }

  error_page 404 /404.html;

  gzip on;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
