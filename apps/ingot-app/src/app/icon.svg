<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ingot">
  <title>Ingot</title>
  <!--
    A cast bar seen end on, and the two rules stacked under it.

    The palette is `globals.css` and nothing else: the accent for the ground,
    ink-inverse for the bar and the first rule, and that same ink-inverse held
    at 62% for the second. The muted rule is written as an opacity rather than
    the colour it resolves to, because a fourth hex would be a fourth answer to
    a question the tokens have already answered. Square corners because
    `--radius` is 0 everywhere on the site and a rounded icon would be the one
    thing that is not.

    Drawn on a 64 unit grid so every vertex is a whole number — the artwork
    this came from is the same drawing at 6.25x, which is why nothing here is
    rounded off. 12 and 52 are the two ends of the base, and the base is shared
    by the bar and the first rule so the eye reads one width and not two. The
    14 units of ground above the crown are the 14 below the last rule.

    `scripts/render-icon.py` repeats these coordinates to write the `.ico` and
    the Apple icon. Change one, run it, commit both.
  -->
  <rect width="64" height="64" fill="#305d8f"/>
  <path d="M19 14h26l7 16H12z" fill="#f8f4f4"/>
  <rect x="12" y="38" width="40" height="4" fill="#f8f4f4"/>
  <rect x="12" y="46" width="28" height="4" fill="#f8f4f4" fill-opacity=".62"/>
</svg>
