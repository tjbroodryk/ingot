{{- if .Values.secrets.create }}
# The convenience path, and not the recommended one — anything here came from a
# values file, and a values file ends up in git. `secrets.create: false` with a
# Secret you made yourself is the default for that reason.
#
# ── why this is a hook ─────────────────────────────────────────────────────
# The migration Job is a `pre-install,pre-upgrade` hook, and Helm runs every
# hook in a phase before it applies any of the release's ordinary manifests. A
# Secret rendered normally would therefore not exist yet when the Job's pod
# tried to resolve `secretKeyRef` — the migration would fail on a first install
# and only ever work on the second.
#
# So this is a hook too, weighted below the Job so it is created first. Two
# consequences worth knowing rather than discovering:
#
#  · it is not part of the release manifest, so `helm get manifest` will not
#    show it and `helm uninstall` will not remove it;
#  · `before-hook-creation` means each install or upgrade replaces it, so
#    changing a value here does reach the cluster.
#
# None of this applies when you bring your own Secret, which is the other
# reason that is the default.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ingot.fullname" . }}-secrets
  labels:
    {{- include "ingot.server.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-10'
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  INGOT_API_KEY: {{ .Values.secrets.apiKey | quote }}
  {{- with .Values.secrets.s3AccessKeyId }}
  INGOT_S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretAccessKey }}
  INGOT_S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.rabbitmqUrl }}
  INGOT_RABBITMQ_URL: {{ . | quote }}
  {{- end }}
{{- end }}
