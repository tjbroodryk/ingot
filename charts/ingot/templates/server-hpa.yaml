{{- if .Values.server.autoscaling.enabled }}
# Scaling the API is safe in a way that is worth being explicit about.
#
# Roll-up and expiry take a Postgres advisory lock, so a scale-up during a busy
# hour cannot produce two pods folding the same overlay into the same
# generation. The queue sweepers lease their rows and run on every replica, so
# pods added here drain the background queues too.
#
# Requires metrics-server. Without it the HPA reports `<unknown>/70%` and holds
# at minReplicas, which is at least the safe direction to fail in.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ingot.fullname" . }}-server
  labels:
    {{- include "ingot.server.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ingot.fullname" . }}-server
  minReplicas: {{ .Values.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.server.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Against the CPU request in `server.resources`. CPU rather than
          # memory is the signal on purpose: DuckDB holds its query budget for
          # the length of a session, so memory utilisation reflects what the
          # engine was allowed to reserve rather than how much work is arriving.
          averageUtilization: {{ .Values.server.autoscaling.targetCPUUtilizationPercentage }}
    {{- with .Values.server.autoscaling.metrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  behavior:
    scaleUp:
      # The default is a five-minute window that smooths away exactly the spike
      # worth reacting to.
      stabilizationWindowSeconds: 60
    scaleDown:
      # Slow, because the cost of removing a pod is a query that was mid-flight
      # and the cost of keeping one is a few minutes of an idle process.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
{{- end }}
