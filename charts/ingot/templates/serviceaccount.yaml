{{- if .Values.serviceAccount.create }}
# No RBAC attached, and none needed: Ingot talks to Postgres and a bucket, and
# never to the API server.
#
# It exists for its annotations. An IRSA role on EKS or a Workload Identity
# binding on GKE hands credentials to the pod through the SDK's default
# provider chain, which is how the `s3` access keys leave the Secret entirely —
# and it is the only way the `gcs` driver and the Vertex adapters work at all,
# since neither has a key to configure. The credential is not ours to hold.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ingot.serviceAccountName" . }}
  labels:
    {{- include "ingot.server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
